name: Science Editorial Draft Pipeline
on:
  push:
    paths:
      - 'scripts/science_editorial_pipeline.py'
      - 'schemas/science-editorial-draft.schema.json'
      - 'tests/test_science_editorial_pipeline.py'
      - '.github/workflows/science-editorial-draft.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  editorial-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check jsonschema
      - name: Deterministic tests
        run: python -m unittest discover -s tests -p 'test_science_editorial_pipeline.py' -v
      - name: Select candidates and generate demonstration drafts
        run: |
          EVIDENCE=evidence/science/2026-11-07-run-42364875053-attempt-1.json
          python scripts/science_editorial_pipeline.py --evidence "$EVIDENCE" --selection-output drafts/science/2026-11-07-selection.json --draft-dir drafts/science/2026-11-07
      - name: Validate schema and evidence references
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from jsonschema import validate
          schema=json.loads(Path("schemas/science-editorial-draft.schema.json").read_text())
          evidence="evidence/science/2026-11-07-run-42364875053-attempt-1.json"
          for p in Path("drafts/science/2026-11-07").glob("science-*.json"):
              d=json.loads(p.read_text()); validate(d,schema)
              subprocess.run(["python","scripts/science_editorial_pipeline.py","--evidence",evidence,"--review",str(p)],check=True)
          print("Drafts structurally valid; this is not independent scientific fact-checking.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: science-editorial-drafts
          path: drafts/science/2026-11-07/
      - name: Commit drafts only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts/science
          git diff --cached --quiet || git commit -m "chore: add science editorial draft demonstration"
          git push
