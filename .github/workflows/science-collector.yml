
name: Science Collector V1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Collect research candidates
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          journals = {
              "physics": [
                  "Physical Review Letters",
                  "Nature Physics"
              ],
              "biology": [
                  "Cell",
                  "Nature Genetics"
              ],
              "chemistry": [
                  "Nature Chemistry",
                  "Journal of the American Chemical Society"
              ],
              "astronomy": [
                  "Nature Astronomy",
                  "Astronomy & Astrophysics"
              ],
              "computer_science": [
                  "ACM Computing Surveys",
                  "IEEE Transactions on Pattern Analysis and Machine Intelligence"
              ]
          }

          now = datetime.now(timezone.utc)
          start = (now - timedelta(days=14)).date()
          end = now.date()

          candidates = []
          seen_dois = set()
          errors = []

          for subject, titles in journals.items():
              for journal in titles:
                  params = {
                      "query.container-title": journal,
                      "filter": (
                          f"from-pub-date:{start},"
                          f"until-pub-date:{end},"
                          "type:journal-article"
                      ),
                      "rows": 20,
                      "sort": "published",
                      "order": "desc"
                  }

                  url = (
                      "https://api.crossref.org/works?"
                      + urllib.parse.urlencode(params)
                  )

                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "LearningOS-News/0.2",
                          "Accept": "application/json"
                      }
                  )

                  try:
                      with urllib.request.urlopen(
                          request, timeout=30
                      ) as response:
                          records = json.load(response)["message"]["items"]
                  except Exception as exc:
                      errors.append({
                          "journal": journal,
                          "error": str(exc)
                      })
                      print("FAILED:", journal, exc)
                      continue

                  count = 0

                  for item in records:
                      actual_journals = item.get(
                          "container-title", []
                      )

                      # Crossref journal searches can be fuzzy.
                      if not any(
                          name.strip().casefold() == journal.casefold()
                          for name in actual_journals
                      ):
                          continue

                      doi = item.get("DOI", "").strip()
                      titles_found = item.get("title", [])

                      if not doi or not titles_found:
                          continue

                      key = doi.casefold()

                      if key in seen_dois:
                          continue

                      parts = item.get(
                          "published", {}
                      ).get("date-parts", [[]])[0]

                      publication_date = "-".join(
                          str(p).zfill(2) if i else str(p)
                          for i, p in enumerate(parts)
                      )

                      candidates.append({
                          "id": key,
                          "subject": subject,
                          "title": titles_found[0],
                          "journal": journal,
                          "doi": doi,
                          "publicationDate": publication_date,
                          "url": item.get(
                              "URL", f"https://doi.org/{doi}"
                          ),
                          "publisher": item.get("publisher"),
                          "recordType": item.get("type"),
                          "source": "Crossref",
                          "reviewStatus": "pending",
                          "importanceScore": None
                      })

                      seen_dois.add(key)
                      count += 1

                  print(subject, journal, count)
                  time.sleep(0.5)

          if errors:
              print("Source errors:", len(errors))

          if not candidates:
              raise RuntimeError(
                  "No candidates collected. Check sources and filters."
              )

          # If a source failed, do not treat this as
          # a complete collection.
          output = {
              "schemaVersion": "1.0",
              "kind": "research_candidate_pool",
              "status": "partial" if errors else "complete",
              "collectedAt": now.isoformat(),
              "window": {
                  "from": str(start),
                  "to": str(end)
              },
              "count": len(candidates),
              "sourceErrors": errors,
              "papers": candidates
          }

          with open(
              "science-candidates.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output, f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Total candidates:", len(candidates))
          print("Subject distribution:")

          for subject in journals:
              n = sum(
                  p["subject"] == subject
                  for p in candidates
              )
              print(subject, n)

          PY

      - name: Upload candidate pool
        uses: actions/upload-artifact@v4
        with:
          name: science-candidates
          path: science-candidates.json
          retention-days: 7
          if-no-files-found: error
