name: Science Editorial Quality Gate

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/science_quality_gate.py"
      - "schemas/science-editorial-draft.schema.json"
      - "tests/test_science_quality_gate.py"
      - "drafts/2026-11-07-science-ready-candidates.json"
      - "drafts/science/2026-11-07-besiii-ai-pilot.json"
      - "schemas/science-editorial-draft-v2.schema.json"
      - "schemas/science-semantic-review.schema.json"
      - "scripts/semantic_review_gate.py"
      - "tests/test_semantic_review_gate.py"
      - "reviews/science/2026-11-07-besiii-semantic-review.json"

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate V1 and V2 JSON inputs
        run: |
          python3 - <<'PY'
          import json
          for path in [
              'schemas/science-editorial-draft.schema.json',
              'schemas/science-editorial-draft-v2.schema.json',
              'schemas/science-semantic-review.schema.json',
              'drafts/2026-11-07-science-ready-candidates.json',
              'drafts/science/2026-11-07-besiii-ai-pilot.json',
              'reviews/science/2026-11-07-besiii-semantic-review.json',
          ]:
              json.load(open(path, encoding='utf-8'))
              print('JSON OK', path)
          PY
      - name: Run deterministic unit tests
        run: python3 -m unittest discover -s tests -p 'test_science_quality_gate.py' -v
      - name: Run V2 AI Draft evidence gate
        run: |
          python3 scripts/science_quality_gate.py --draft drafts/science/2026-11-07-besiii-ai-pilot.json --editions-dir editions --schema schemas/science-editorial-draft-v2.schema.json --output /tmp/science-ai-draft-gate-result.json
          cat /tmp/science-ai-draft-gate-result.json
      - name: Run semantic review record gate
        run: |
          python3 -m unittest discover -s tests -p 'test_semantic_review_gate.py' -v
          python3 scripts/semantic_review_gate.py --draft drafts/science/2026-11-07-besiii-ai-pilot.json --review reviews/science/2026-11-07-besiii-semantic-review.json --output /tmp/science-semantic-review-result.json
          cat /tmp/science-semantic-review-result.json
